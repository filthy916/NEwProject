services:
  - type: web
    name: newproject-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BRIDGE_SECRET_916
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: OPENAI_MODEL
        value: gpt-4o-mini
